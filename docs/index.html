<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Radiologie-Praxis — Auswertung</title>
<style>
:root{--bg:#f1f5f9;--card:#fff;--ink:#0f172a;--muted:#64748b;--line:#e2e8f0;
      --blue:#2563eb;--green:#059669;--amber:#d97706;--red:#dc2626;--navy:#0b1426}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
     font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
header{background:var(--navy);color:#fff;padding:18px 24px;display:flex;
       align-items:center;gap:16px;flex-wrap:wrap}
header h1{margin:0;font-size:18px;font-weight:700}
header .sub{font-size:12px;color:#94a3b8}
header .right{margin-left:auto;display:flex;align-items:center;gap:12px;font-size:12px}
.pill{background:#1e293b;border-radius:999px;padding:4px 11px;color:#cbd5e1;font-size:11px}
.ds{display:flex;gap:0;border:1px solid #334155;border-radius:8px;overflow:hidden}
.ds button{background:#1e293b;color:#cbd5e1;border:0;padding:6px 13px;font-size:12px;
           cursor:pointer;font-family:inherit}
.ds button.on{background:var(--blue);color:#fff;font-weight:600}
.filters{background:#fff;border-bottom:1px solid var(--line);padding:12px 24px;
         display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.f{display:flex;align-items:center;gap:6px}
.f label{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;
         letter-spacing:.4px}
select,input{font:inherit;font-size:13px;padding:5px 8px;border:1px solid var(--line);
             border-radius:6px;background:#fff;color:var(--ink)}
.reset{margin-left:auto;font-size:12px;color:var(--blue);background:none;border:0;
       cursor:pointer;font-family:inherit;text-decoration:underline}
main{padding:22px 24px 60px;max-width:1280px;margin:0 auto}
.sh{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;
    color:var(--muted);margin:26px 0 12px;display:flex;align-items:center;gap:10px}
.sh::after{content:"";flex:1;height:1px;background:var(--line)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.card h3{margin:0 0 3px;font-size:14px;font-weight:700}
.card .note{font-size:12px;color:var(--muted);margin:0 0 12px}
.kpi{font-size:27px;font-weight:700;letter-spacing:-.5px;margin:6px 0 2px}
.kpi.small{font-size:19px}
.kpi-sub{font-size:12px;color:var(--muted)}
.frage{background:#f8fafc;border-left:3px solid var(--blue);padding:8px 11px;margin:0 0 10px;
       font-size:12.5px;color:#334155;border-radius:0 6px 6px 0}

table{border-collapse:collapse;width:100%;font-size:13px}
th.s{cursor:pointer;user-select:none}
th.s:hover{color:var(--blue)}
.tw{overflow-x:auto}
th{text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.4px;
   color:var(--muted);border-bottom:1px solid var(--line);padding:6px 8px 6px 0}
td{padding:6px 8px 6px 0;border-bottom:1px solid #f1f5f9}
td.n,th.n{text-align:right}
tr.tie td{background:#fffbeb}
.chart{height:230px;position:relative}
.sqlbtn{margin-top:12px;font-size:11px;color:var(--blue);background:none;border:0;
        cursor:pointer;padding:0;font-family:inherit;text-decoration:underline}
pre{background:#0b1426;color:#e2e8f0;padding:12px 14px;border-radius:8px;overflow-x:auto;
    font-size:11.5px;line-height:1.45;margin:10px 0 0}
pre .p{color:#fbbf24}
.loading{text-align:center;padding:70px 20px;color:var(--muted)}
.spin{display:inline-block;width:22px;height:22px;border:3px solid var(--line);
      border-top-color:var(--blue);border-radius:50%;animation:s 1s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
.err{background:#fef2f2;border:1px solid #fecaca;color:#991b1b;padding:12px 14px;
     border-radius:8px;font-size:13px}
</style>
</head>
<body>
<header>
  <div>
    <h1>Radiologie-Praxis — Auswertung</h1>
    <div class="sub">PostgreSQL läuft in dieser Seite · alle Daten erfunden</div>
  </div>
  <div class="right">
    <span class="pill" id="pgver">lädt …</span>
    <div class="ds">
      <button id="ds-test" class="on">Prüfdatensatz</button>
      <button id="ds-demo">Demo-Daten</button>
    </div>
  </div>
</header>

<div class="filters" id="filters" hidden>
  <div class="f"><label>Von</label><input type="date" id="f-von"></div>
  <div class="f"><label>Bis</label><input type="date" id="f-bis"></div>
  <div class="f"><label>Gerät</label><select id="f-device"></select></div>
  <div class="f"><label>Typ</label><select id="f-type"></select></div>
  <div class="f"><label>Untersuchung</label><select id="f-examtype"></select></div>
  <div class="f"><label>Versicherung</label><select id="f-insurance"></select></div>
  <div class="f"><label>Status</label><select id="f-status"></select></div>
  <button class="reset" id="reset">Filter zurücksetzen</button>
</div>

<main>
  <div class="loading" id="loading">
    <div class="spin"></div>
    <p>PostgreSQL startet im Browser …<br>
       <span style="font-size:12px">Beim ersten Aufruf werden rund 3 MB geladen.</span></p>
  </div>
  <div id="app" hidden></div>
</main>

<script src="vendor/chart.umd.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
